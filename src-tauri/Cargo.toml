[package]
name = "overthinker-notch"
version = "0.2.0"
description = "Overthinker Notch — Pusat Produktivitas Desktop Futuristik"
authors = ["Overthinker Studio"]
edition = "2021"

[lib]
name = "overthinker_notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
